###############################################
# Gujarat CCTV Hackathon 2026 — Stream Gateway config
###############################################

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# HLS output.
# fmp4 variant: compatible with all modern browsers via hls.js.
# Key tuning for fast on-demand startup:
#   - hlsSegmentCount 2: only 2 segments needed before manifest is served
#     (2 x 1s = 2s of buffering required — much faster than the default 7).
#   - hlsSegmentDuration 1s: 1-second segments.
#   - hlsMuxerCloseAfter 30s: keep muxer warm so next viewer starts instantly.
#   - hlsAlwaysRemux false: only active when someone is watching (saves CPU).
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsMuxerCloseAfter: 30s
hlsAlwaysRemux: false

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: ["127.0.0.1", "localhost"]

paths: {}